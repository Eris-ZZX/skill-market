[package]
name = "skill-market"
version = "0.1.0"
description = "内网 Skill 市场 — 面向 AI 编码工具的技能分发客户端"
authors = ["your-team"]
license = "MIT"
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "skill_market_lib"
crate-type = ["rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
# --- Tauri 核心 ---
tauri = { version = "2.8.2" }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# --- 序列化 ---
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"

# --- 基础设施 ---
anyhow = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tempfile = "3"
url = "2"

# --- 哈希（技能内容更新检测）---
sha2 = "0.10"

# --- HTTP（GitLab API、归档下载）---
# 注意：必须用 ring 而非 aws-lc-rs —— 后者含 NASM 汇编，
# 在公司 DLP 环境下会被加密拦截，导致编译失败。
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "charset",
  "http2",
  "rustls-tls-native-roots-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

# --- 归档解压（技能包）---
zip = "2.2"

[dev-dependencies]
# 只给集成测试用：mock_app 让我们能构造 tauri::State 去测命令层守卫
tauri = { version = "2.8.2", features = ["test"] }

[features]
default = []

[profile.release]
# 体积优先：本项目是内部工具，不需要极致运行性能，
# 但安装包越小分发越省事（目标 < 20MB，不含 WebView2）。
codegen-units = 1     # 单编译单元，LLVM 全局优化更彻底，体积最小
lto = true            # fat LTO（比 "thin" 更小，编译更慢）
opt-level = "z"       # 比 "s" 更激进地优化体积
strip = true          # 剥离所有符号与调试信息
panic = "abort"       # 省掉 unwind 表（代价：panic 时无 backtrace）
